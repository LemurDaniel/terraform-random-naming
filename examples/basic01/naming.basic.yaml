# Custom override on top of the "default" convention.
#
# Every key is merged per-entry over convention/default.naming.yaml in the
# terraform-random-naming-schema repository, so only the keys that actually
# differ belong here.
#
# This example overrides nothing but the index offset: indices now start at 00
# instead of 01. All patterns, abbreviations and mappings come from the default
# convention.

index_modifier: 0
