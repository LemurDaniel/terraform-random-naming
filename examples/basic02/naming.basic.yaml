# Custom override on top of the "default" convention.
#
# Every key is merged per-entry over convention/default.naming.yaml in the
# terraform-random-naming-schema repository, so only the keys that actually
# differ belong here - the storage account's `default` pattern and every other
# resource type keep coming from the default convention.
#
# This adds a `vm_pattern` variant for storage accounts that drops
# <ENVIRONMENT>. Passing `naming_id = "vm_pattern"` selects it, and the same
# naming_id also resolves the abbreviation
# `Microsoft.Storage/storageAccounts::vm` => "stvm" from the default
# convention.

patterns:
  Azure:
    Microsoft.Storage/storageAccounts:
      vm_pattern: "<TYPE><LOCATION><NAME><INDEX;%02s>"
