# Custom override on top of the "default" convention.
#
# Every key is merged per-entry over convention/default.naming.yaml in the
# terraform-random-naming-schema repository, so only the keys that actually
# differ belong here.
#
# This overrides the AzureAD provider default to put <NAME> before
# <ENVIRONMENT>. The Azure provider patterns, all abbreviations and all
# mappings keep coming from the default convention.

patterns:
  AzureAD:
    default: "<TYPE>-<NAME>-<ENVIRONMENT>-<INDEX;%02s>"
